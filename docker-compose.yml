services:
  db:
    image: postgres:16-alpine
    container_name: entailsng_postgres
    restart: always
    environment:
      POSTGRES_DB: entailsng_db
      POSTGRES_USER: entailsng
      POSTGRES_PASSWORD: entailsng_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U entailsng -d entailsng_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
