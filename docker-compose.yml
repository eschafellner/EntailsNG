services:
  db:
    image: postgres:16-alpine
    container_name: entailsng_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-entailsng_db}
      POSTGRES_USER: ${DB_USER:-entailsng}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-entailsng_secret}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-entailsng} -d ${DB_NAME:-entailsng_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: entailsng_redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build: .
    container_name: entailsng_web
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DB_ENGINE=postgresql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-entailsng_db}
      - DB_USER=${DB_USER:-entailsng}
      - DB_PASSWORD=${DB_PASSWORD:-entailsng_secret}
      - SECRET_KEY=${SECRET_KEY:-django-insecure-production-fallback-key-replace-me-12345}
      - DEBUG=${DEBUG:-False}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      - REDIS_URL=redis://redis:6379/1
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy


volumes:
  postgres_data:
  redis_data:
  media_data:

