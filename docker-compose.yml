services:
  db:
    image: postgres:16-alpine
    container_name: entailsng_postgres
    restart: always
    environment:
      POSTGRES_DB: entailsng_db
      POSTGRES_USER: entailsng
      POSTGRES_PASSWORD: entailsng_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U entailsng -d entailsng_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: entailsng_web
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DB_ENGINE=postgresql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=entailsng_db
      - DB_USER=entailsng
      - DB_PASSWORD=entailsng_secret
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
