name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  test:
    name: PostgreSQL Test Suite & Checks
    runs-on: ubuntu-24.04
    env:
      DEBUG: "False"
      SECURE_SSL_REDIRECT: "False"
      ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
      SECRET_KEY: "ci-insecure-dummy-key-for-tests-only-long-enough-for-django"
      FIELD_ENCRYPTION_KEY: "ci-field-tests-only"
      DB_NAME: "entailsng_test"
      DB_USER: "entailsng_test"
      DB_PASSWORD: "ci-tests-only"
      DB_HOST: "127.0.0.1"
      DB_PORT: "5432"
      BACKUP_PG_BIN_DIR: "/usr/lib/postgresql/16/bin"
      REDIS_URL: "redis://localhost:6379/1"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: entailsng_test
          POSTGRES_USER: entailsng_test
          POSTGRES_PASSWORD: ci-tests-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U entailsng_test -d entailsng_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install PostgreSQL Tools and Python Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
          python -m venv "$RUNNER_TEMP/entails-app"
          echo "$RUNNER_TEMP/entails-app/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/entails-app/bin/python" -m pip install pip==26.2.1
          "$RUNNER_TEMP/entails-app/bin/python" -m pip install -r requirements.txt
      - name: Check Installed Dependencies and Export Complete Inventory
        run: |
          python -m pip check
          python scripts/dependency_inventory.py --output-dir smoke-results
      - name: Lint With Separate Tool Environment
        run: |
          python -m venv "$RUNNER_TEMP/entails-lint"
          "$RUNNER_TEMP/entails-lint/bin/python" -m pip install ruff==0.17.3
          "$RUNNER_TEMP/entails-lint/bin/ruff" check .
      - name: Audit Installed Packages With Separate Tool Environment
        run: |
          python -m venv "$RUNNER_TEMP/entails-audit"
          "$RUNNER_TEMP/entails-audit/bin/python" -m pip install pip-audit==2.10.1
          "$RUNNER_TEMP/entails-audit/bin/python" scripts/audit_dependencies.py --inventory smoke-results/runtime-requirements.txt --output-dir smoke-results
      - name: Set up Node for Browser Tests
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '22'
      - name: Test Browser Interactions
        run: node --test scripts/tests/*.test.cjs
      - name: Run Django Security & Deployment Check
        env:
          SECURE_SSL_REDIRECT: 'True'
        run: python manage.py check --deploy --fail-level WARNING
      - name: Run Full Test Suite Including Row Locks and Native Backups
        run: python manage.py test --noinput
      - name: Check Missing Migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Prove Real Cross-Process Redis Cache
        env:
          ENTAILS_SETUP_SMOKE: '1'
        run: python scripts/redis_smoke.py
      - name: Reproduce Fresh Setup and Demo Initialization
        env:
          ENTAILS_SETUP_SMOKE: '1'
        run: |
          mkdir -p smoke-results
          PGPASSWORD="$DB_PASSWORD" psql -h "$DB_HOST" -U "$DB_USER" -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE entails_smoke_ci'
          DB_NAME=entails_smoke_ci python scripts/setup_smoke.py > smoke-results/setup.json
      - name: Upload Setup Evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: setup-evidence
          path: smoke-results/
          if-no-files-found: ignore

  container-smoke:
    name: Isolated Image Build and Compose Startup
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
      - name: Check Pinned Operational Images
        run: |
          docker run --rm certbot/certbot@sha256:f70ad0adbb7e117f0fe42a63c553f28ea451edabc0148757b6efcd9735acaa20 --version
          docker run --rm cloudflare/cloudflared:2026.10.0@sha256:9b49eed8f62806d5d45ddf59ecefb5710429598ea6d3fcccd2af938f621b2b07 --version
      - name: Build and Start Temporary Stack
        run: python scripts/container_smoke.py --output-dir smoke-results --performance
      - name: Audit Actual Image Package Inventory
        run: |
          python -m venv "$RUNNER_TEMP/entails-image-audit"
          "$RUNNER_TEMP/entails-image-audit/bin/python" -m pip install pip-audit==2.10.1
          "$RUNNER_TEMP/entails-image-audit/bin/python" scripts/audit_dependencies.py --inventory smoke-results/runtime-requirements.txt --output-dir smoke-results
      - name: Upload Sanitized Container Evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: container-evidence
          path: smoke-results/
          if-no-files-found: ignore
