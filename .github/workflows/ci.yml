name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Django Test Suite & Checks
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django Security & Deployment Check
        env:
          SECRET_KEY: 'ci-secret-key-for-testing-purposes-only'
          DEBUG: 'False'
          DB_ENGINE: 'sqlite'
          REDIS_URL: 'redis://localhost:6379/1'
          ALLOWED_HOSTS: 'localhost,127.0.0.1'
        run: |
          python manage.py check --deploy

      - name: Check Missing Migrations
        env:
          SECRET_KEY: 'ci-secret-key-for-testing-purposes-only'
          DB_ENGINE: 'sqlite'
        run: |
          python manage.py makemigrations --check --dry-run

      - name: Run Test Suite
        env:
          SECRET_KEY: 'ci-secret-key-for-testing-purposes-only'
          DB_ENGINE: 'sqlite'
          REDIS_URL: 'redis://localhost:6379/1'
        run: |
          python manage.py test
