name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  account-deletion-postgresql:
    name: Account Deletion & Tournaments (PostgreSQL Row Locks)
    runs-on: ubuntu-latest
    env:
      DEBUG: "False"
      ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
      SECRET_KEY: "ci-account-deletion-tests-only"
      DB_ENGINE: "postgresql"
      DB_NAME: "entailsng_test"
      DB_USER: "entailsng_test"
      DB_PASSWORD: "ci-tests-only"
      DB_HOST: "127.0.0.1"
      DB_PORT: "5432"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: entailsng_test
          POSTGRES_USER: entailsng_test
          POSTGRES_PASSWORD: ci-tests-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U entailsng_test -d entailsng_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install Dependencies
        run: python -m pip install -r requirements.txt
      - name: Test Account Deletion and Concurrent Tournament Actions
        run: python manage.py test users.test_account_deletion tournaments.test_swiss tournaments.test_swiss_concurrency tournaments.test_audit tournaments.test_audit_concurrency tournaments.test_solo_reactivation knowledge --noinput

  test:
    name: Django Test Suite & Checks
    env:
       # Für CI-Testläufe explizit setzen:
      DEBUG: "False"
      ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
      SECRET_KEY: "ci-insecure-dummy-key-for-tests-only"
      DB_ENGINE: "sqlite"
      REDIS_URL: "redis://localhost:6379/1"
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Node for Scanner Tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test Scanner Feedback and Tournament Views
        run: node --test scripts/tests/checkin-scanner.test.cjs scripts/tests/tournaments.test.cjs

      - name: Run Django Security & Deployment Check
        env:
          SECRET_KEY: 'ci-secret-key-for-testing-purposes-only'
          DEBUG: 'False'
          DB_ENGINE: 'sqlite'
          REDIS_URL: 'redis://localhost:6379/1'
          ALLOWED_HOSTS: 'localhost,127.0.0.1'
        run: |
          python manage.py check --deploy

      - name: Check Missing Migrations
        env:
          SECRET_KEY: 'ci-secret-key-for-testing-purposes-only'
          DB_ENGINE: 'sqlite'
        run: |
          python manage.py makemigrations --check --dry-run

      - name: Run Test Suite
        env:
          SECRET_KEY: 'ci-secret-key-for-testing-purposes-only'
          DB_ENGINE: 'sqlite'
          REDIS_URL: 'redis://localhost:6379/1'
        run: |
          python manage.py test
