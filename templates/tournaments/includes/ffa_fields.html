      <div style="max-height: 380px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; padding-right: 4px;">
        {% for p in ffa_participants %}
          <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel);">
            <div style="flex: 2; font-family: 'DM Sans', sans-serif; font-size: 14px;">
              <strong>{{ p.team.name }}</strong>
            </div>
            <div style="flex: 1; display: flex; align-items: center; gap: 4px;">
              <label for="rank_{{ p.id }}" style="font-size: 14px; color: var(--muted);">{% t "tournament_ffa_rank_label" "Rang:" %}</label>
              <input type="number" id="rank_{{ p.id }}" name="rank_{{ p.id }}" aria-label="{{ p.team.name }} — {% t 'tournament_ffa_rank_label' %}" value="{{ p.rank|default:'' }}" min="1" max="{{ ffa_participants|length }}" placeholder="1" style="width: 50px; padding: 4px; border-radius: 4px; border: 1px solid var(--line); font-family: 'DM Sans', sans-serif; text-align: center;">
            </div>
            <div style="flex: 1; display: flex; align-items: center; gap: 4px;">
              <label for="score_{{ p.id }}" style="font-size: 14px; color: var(--muted);">{% t "tournament_ffa_points_label" "Pkt:" %}</label>
              <input type="number" id="score_{{ p.id }}" name="score_{{ p.id }}" aria-label="{{ p.team.name }} — {% t 'tournament_ffa_points_label' %}" value="{{ p.score|default:0 }}" style="width: 55px; padding: 4px; border-radius: 4px; border: 1px solid var(--line); font-family: 'DM Sans', sans-serif; text-align: center;">
            </div>
            <label style="flex-basis: 100%; font-size: 14px;"><input type="checkbox" name="dq_{{ p.id }}" {% if p.is_disqualified %}checked{% endif %}> {{ p.team.name }} — {% t 'tournament_ffa_dq_label' 'Disqualifiziert' %}</label>
            <label for="notes_{{ p.id }}" style="flex-basis: 100%; font-size: 14px;">{{ p.team.name }} — {% t 'tournament_ffa_notes_label' 'Notiz' %}</label>
            <input type="text" id="notes_{{ p.id }}" name="notes_{{ p.id }}" maxlength="255" value="{{ p.notes }}" style="width: 100%; padding: 6px; border: 1px solid var(--line); border-radius: 4px;">
          </div>
        {% endfor %}
      </div>

      <label for="ffa_reason">{% if ffa_match.status == 'COMPLETED' %}{% t 'results_reason' %}{% else %}{% t 'tournament_modal_reason_label' %}{% endif %}</label>
      <input id="ffa_reason" name="decision_reason" maxlength="255" {% if ffa_match.status == 'COMPLETED' %}required{% endif %}>
