{% load static %}
<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% t "pw_reset_complete_title" %} – EntailsNG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card" style="text-align: center;">
      <div class="auth-header">
        <div style="font-size: 48px; margin-bottom: 12px;">✅</div>
        <h1 style="font-size: 26px;">{% t "pw_reset_complete_title" %}</h1>
        <p style="color: var(--muted); font-size: 14px; line-height: 1.6; margin-top: 12px;">
          {% t "pw_reset_complete_text" %}
        </p>
      </div>

      <div class="auth-footer" style="margin-top: 24px;">
        <a href="{% url 'login' %}" class="primary-btn auth-btn" style="display: block; text-decoration: none;">
          Jetzt anmelden
        </a>
      </div>
    </div>
  </div>
</body>
</html>
