{% load static %}
<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% t "pw_reset_complete_title" %} – {{ site_customization.site_name }}{{ site_customization.brand_accent_text }}</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <link rel="stylesheet" href="{% static 'css/fonts.css' %}">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card" style="text-align: center;">
      <div class="auth-header">
        <div style="font-size: 48px; margin-bottom: 12px;">✅</div>
        <h1 style="font-size: 26px;">{% t "pw_reset_complete_title" %}</h1>
        <p style="color: var(--muted); font-size: 14px; line-height: 1.6; margin-top: 12px;">
          {% t "pw_reset_complete_text" %}
        </p>
      </div>

      <div class="auth-footer" style="margin-top: 24px;">
        <a href="{% url 'login' %}" class="primary-btn auth-btn" style="display: block; text-decoration: none;">
          {% t "nav_login" "Jetzt anmelden" %}
        </a>
      </div>
    </div>
  </div>
</body>
</html>
