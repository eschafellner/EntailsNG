{% load static %}
<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ txt_pw_reset_title }} – EntailsNG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="brand-mark">HNX</div>
        <h1>{{ txt_pw_reset_title }}</h1>
        <p style="color: var(--muted); font-size: 14px;">{{ txt_pw_reset_subtitle }}</p>
      </div>

      <form method="post" action="{% url 'password_reset' %}">
        {% csrf_token %}
        <div class="form-group">
          <label for="id_email">E-Mail-Adresse</label>
          {{ form.email }}
        </div>

        <button type="submit" class="primary-btn auth-btn">{{ txt_pw_reset_btn }}</button>
      </form>

      <div class="auth-footer">
        <a href="{% url 'login' %}">← Zurück zur Anmeldung</a>
      </div>
    </div>
  </div>
</body>
</html>
