{% extends 'base.html' %}

{% block title %}404 – Seite nicht gefunden – EntailsNG{% endblock %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 40px auto; text-align: center; padding: 40px 24px;">
  <div style="font-family: 'Barlow Condensed', sans-serif; font-size: 80px; font-weight: 800; line-height: 1; color: var(--signal-deep); margin-bottom: 8px;">
    404
  </div>

  <h1 style="font-family: 'Barlow Condensed', sans-serif; font-size: 32px; margin-bottom: 12px; color: var(--ink);">
    Seite nicht gefunden
  </h1>

  <p style="color: var(--muted); font-size: 15px; font-family: 'JetBrains Mono', monospace; line-height: 1.6; margin-bottom: 28px;">
    Die von dir angeforderte Adresse existiert nicht oder wurde verschoben.
  </p>

  <a href="{% url 'dashboard' %}" class="btn-login" style="display: inline-block; width: auto; padding: 12px 24px; text-decoration: none; font-weight: bold;">
    ← Zurück zur Startseite
  </a>
</div>
{% endblock %}
